---
dependency:
  name: galaxy
{%- if cookiecutter.molecule == "docker" %}
driver:
  name: docker
platforms:
  - name: instance
    # yamllint disable-line rule:quoted-strings
    image: "${NAMESPACE:-dudecalledbro}/${IMAGE:-molecule-rockylinux-9}:${TAG:-latest}"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    # yamllint disable-line rule:quoted-strings
    converge: "${MOLECULE_SCENARIO_DIRECTORY}/../../main.yml"
{%- elif cookiecutter.molecule == "vagrant" %}
driver:
  name: vagrant
  provider:
    name: qemu
platforms:
  - name: instance
    # yamllint disable-line rule:quoted-strings
    box: "${VAGRANT_BOX:-cloud-image/debian-12}"
    memory: 2048
    cpus: 1
provisioner:
  name: ansible
  connection_options:
    ansible_become: true
    ansible_ssh_user: vagrant
  playbooks:
    # yamllint disable-line rule:quoted-strings
    converge: "${MOLECULE_SCENARIO_DIRECTORY}/../../main.yml"
{%- endif %}
