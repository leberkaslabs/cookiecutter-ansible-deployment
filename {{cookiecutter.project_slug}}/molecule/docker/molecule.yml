---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    # yamllint disable-line rule:quoted-strings
    image: "${NAMESPACE:-dudecalledbro}/${IMAGE:-molecule-rockylinux-9}:${TAG:-latest}"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    # yamllint disable-line rule:quoted-strings
    converge: "${MOLECULE_SCENARIO_DIRECTORY}/../../main.yml"
